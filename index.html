<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#705dfb">
<title>Ты в сети! — Wi‑Fi Димы</title>
<style>
:root{
  --ink:#182033;
  --muted:#68748d;
  --purple:#705dfb;
  --blue:#3d96ff;
  --line:#e5eaf3;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 13%,rgba(62,151,255,.18),transparent 28%),
    radial-gradient(circle at 90% 85%,rgba(112,93,251,.18),transparent 30%),
    linear-gradient(155deg,#eff9ff,#f6f1ff);
}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.cloud{
  position:absolute;
  width:190px;height:58px;border-radius:999px;
  background:rgba(255,255,255,.72);
  filter:drop-shadow(0 8px 16px rgba(76,91,130,.07));
}
.c1{left:-60px;top:12%}
.c2{right:-70px;top:27%;width:220px}
.c3{left:8%;bottom:5%;width:140px;height:44px}
.star{position:absolute;font-size:24px;opacity:.42}
.s1{left:12%;top:34%;transform:rotate(-16deg)}
.s2{right:13%;top:12%;transform:rotate(18deg)}
.s3{right:10%;bottom:14%}
.wrap{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:22px 14px;
  position:relative;
}
.card{
  width:min(100%,440px);
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.95);
  border-radius:32px;
  box-shadow:0 24px 70px rgba(76,88,133,.20);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  overflow:hidden;
}
.hero{
  padding:30px 25px 22px;
  text-align:center;
}
.robot{
  width:82px;height:82px;
  display:grid;place-items:center;
  margin:0 auto 16px;
  border-radius:27px;
  background:linear-gradient(145deg,var(--purple),var(--blue));
  box-shadow:0 16px 34px rgba(85,89,232,.26);
  font-size:42px;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.tag{
  display:inline-flex;
  gap:7px;align-items:center;
  background:#eefbf1;color:#16803b;
  border:1px solid #d4f1dc;
  padding:7px 10px;border-radius:999px;
  font-size:12px;font-weight:800;
  margin-bottom:12px;
}
h1{
  margin:0 0 10px;
  font-size:34px;
  line-height:1.05;
  letter-spacing:-.03em;
}
.subtitle{
  margin:0 auto;
  max-width:340px;
  color:var(--muted);
  font-size:15px;
  line-height:1.55;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  padding:0 20px 20px;
}
.info{
  min-height:114px;
  padding:16px;
  border-radius:20px;
  background:#f8faff;
  border:1px solid var(--line);
}
.ico{font-size:25px;margin-bottom:9px}
.info strong{display:block;font-size:13px;margin-bottom:5px}
.info span{font-size:12px;line-height:1.4;color:var(--muted)}
.actions{padding:0 20px 22px}
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:54px;
  border-radius:17px;
  text-decoration:none;
  font-weight:850;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  box-shadow:0 12px 25px rgba(83,92,233,.22);
}
.small{
  text-align:center;color:#8993a8;
  font-size:11.5px;line-height:1.5;
  padding:17px 20px 20px;
  border-top:1px solid var(--line);
}
@media(max-width:390px){
  .hero{padding:25px 20px 19px}
  h1{font-size:30px}
  .robot{width:74px;height:74px;border-radius:24px}
  .grid{padding:0 16px 16px}
  .actions{padding:0 16px 18px}
}
</style>
</head>
<body>
<div class="sky">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="star s1">✦</div><div class="star s2">✧</div><div class="star s3">★</div>
</div>

<main class="wrap">
<section class="card">
  <div class="hero">
    <div class="robot">🤖</div>
    <div class="tag">● Интернет подключён</div>
    <h1>Ты в сети! 🚀</h1>
    <p class="subtitle">Добро пожаловать в Wi‑Fi Димы. Можно пользоваться интернетом — приятного серфинга!</p>
  </div>

  <div class="grid">
    <div class="info">
      <div class="ico">🌐</div>
      <strong>Интернет готов</strong>
      <span>Соединение успешно установлено.</span>
    </div>
    <div class="info">
      <div class="ico">🔐</div>
      <strong>Гостевой доступ</strong>
      <span>Домашняя сеть остаётся отдельно.</span>
    </div>
  </div>

  <div class="actions">
    <a class="btn" href="https://ya.ru/">Открыть интернет →</a>
  </div>

  <div class="small">
    Wi‑Fi «Детская Дима» · Хорошего дня ✨
  </div>
</section>
</main>
</body>
</html>
